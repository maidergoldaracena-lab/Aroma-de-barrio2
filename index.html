<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma de Barrio</title>
<meta name="description" content="Pide en Aroma de Barrio desde tu móvil">
<meta name="theme-color" content="#0a0f0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aroma de Barrio">
<style>
  :root{
    --bg: #0a0f0d;
    --surface: #10171450;
    --surface-solid: #131a17;
    --line: #24302c;
    --text: #f2efe9;
    --text-muted: #8b9a95;
    --cyan: #4dd8c4;
    --cyan-dim: #4dd8c422;
    --gold: #c9a227;
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, #14201c 0%, transparent 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 110px;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  header.hero{
    padding: 36px 20px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(34px, 9vw, 46px);
    letter-spacing: 0.3px;
    margin: 0;
    color: var(--text);
  }
  .brand span{ color: var(--cyan); }
  .subtitle{
    margin: 8px 0 0;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  main{ max-width: 560px; margin: 0 auto; padding: 0 16px; }

  nav.tabs{
    display: flex;
    gap: 8px;
    margin: 20px 0 18px;
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 10px 0;
    background: linear-gradient(var(--bg) 78%, transparent);
  }
  .tab{
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-solid);
    color: var(--text-muted);
    font-size: 14.5px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    user-select: none;
  }
  .tab.active{
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }

  section.category{ display: none; }
  section.category.active{ display: block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform: translateY(0);} }

  .item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .item-info{ min-width: 0; }
  .item-name{ font-size: 16px; }
  .item-price{ font-size: 13.5px; color: var(--text-muted); margin-top: 2px; }

  .stepper{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .stepper button{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-solid);
    color: var(--cyan);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .stepper button:active{ background: var(--cyan-dim); }
  .stepper .qty{
    min-width: 18px;
    text-align: center;
    font-size: 15px;
    color: var(--text-muted);
  }
  .qty.has-qty{ color: var(--text); font-weight: 600; }

  .loyalty{
    margin: 30px 0 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    text-align: center;
  }
  .loyalty h3{
    margin: 0 0 4px;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  .loyalty p{ margin: 0 0 14px; font-size: 12.5px; color: var(--text-muted); }
  .stamps{ display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; }
  .stamp{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--text-muted);
  }
  .stamp.filled{
    border: 1.5px solid var(--gold);
    background: #c9a22722;
    color: var(--gold);
  }

  footer.info{
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
    padding: 6px 0 30px;
    line-height: 1.6;
  }

  .cartbar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface-solid);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }
  .cartbar .total-block{ flex: 1; }
  .cartbar .label{ font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .cartbar .total{ font-size: 20px; font-weight: 700; }
  .cartbar button{
    border: none;
    background: var(--cyan);
    color: #05201b;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .cartbar button:disabled{ background: var(--line); color: var(--text-muted); cursor: not-allowed; }
  .cartbar button:not(:disabled):active{ transform: scale(0.97); }
</style>
</head>
<body>

<header class="hero">
  <h1 class="brand">Aroma de <span>Barrio</span></h1>
  <p class="subtitle">Cafetería · Desde 2015</p>
</header>

<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="categories"></div>

  <div class="loyalty">
    <h3>Tarjeta de fidelidad</h3>
    <p>8 cafés sellados = el 9º gratis</p>
    <div class="stamps" id="stamps"></div>
  </div>

  <footer class="info">
    C/ Mayor 14 · Lun–Sáb 8:00–20:00<br>
    Pedidos también por WhatsApp
  </footer>
</main>

<div class="cartbar">
  <div class="total-block">
    <div class="label">Total</div>
    <div class="total" id="total">0,00 €</div>
  </div>
  <button id="orderBtn" disabled>Pedir</button>
</div>

<script>
  // ---------- Datos del menú ----------
  const WHATSAPP_NUMBER = "34696891341";

  const menu = {
    "Bebidas": [
      { id: "b1", name: "Café con leche", price: 1.80 },
      { id: "b2", name: "Cappuccino", price: 2.20 },
      { id: "b3", name: "Café solo", price: 1.50 },
      { id: "b4", name: "Zumo de naranja natural", price: 2.50 },
      { id: "b5", name: "Té / Infusión", price: 1.80 },
    ],
    "Para picar": [
      { id: "p1", name: "Tostada con tomate y aceite", price: 2.50 },
      { id: "p2", name: "Croissant", price: 1.50 },
      { id: "p3", name: "Bocadillo de jamón", price: 3.50 },
      { id: "p4", name: "Napolitana de chocolate", price: 1.70 },
    ]
  };

  const STAMPS_TOTAL = 8;
  const STAMPS_FILLED = 5;

  // ---------- Estado ----------
  const cart = {}; // id -> qty

  const fmt = (n) => n.toFixed(2).replace(".", ",") + " €";

  // ---------- Construcción de pestañas y categorías ----------
  const tabsEl = document.getElementById("tabs");
  const catsEl = document.getElementById("categories");
  const categoryNames = Object.keys(menu);

  categoryNames.forEach((cat, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === 0 ? " active" : "");
    tab.textContent = cat;
    tab.dataset.cat = cat;
    tab.addEventListener("click", () => selectTab(cat));
    tabsEl.appendChild(tab);

    const section = document.createElement("section");
    section.className = "category" + (i === 0 ? " active" : "");
    section.dataset.cat = cat;

    menu[cat].forEach(item => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${fmt(item.price)}</div>
        </div>
        <div class="stepper">
          <button type="button" data-action="dec" data-id="${item.id}" aria-label="Quitar uno">–</button>
          <span class="qty" data-qty="${item.id}">0</span>
          <button type="button" data-action="inc" data-id="${item.id}" aria-label="Añadir uno">+</button>
        </div>
      `;
      section.appendChild(row);
    });

    catsEl.appendChild(section);
  });

  function selectTab(cat) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.cat === cat));
    document.querySelectorAll(".category").forEach(s => s.classList.toggle("active", s.dataset.cat === cat));
  }

  // ---------- Lógica de cantidades ----------
  function findItem(id) {
    for (const cat of categoryNames) {
      const found = menu[cat].find(i => i.id === id);
      if (found) return found;
    }
    return null;
  }

  document.getElementById("categories").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const current = cart[id] || 0;
    if (btn.dataset.action === "inc") {
      cart[id] = current + 1;
    } else {
      cart[id] = Math.max(0, current - 1);
      if (cart[id] === 0) delete cart[id];
    }
    updateUI(id);
  });

  function updateUI(changedId) {
    const qtyEl = document.querySelector(`[data-qty="${changedId}"]`);
    const qty = cart[changedId] || 0;
    qtyEl.textContent = qty;
    qtyEl.classList.toggle("has-qty", qty > 0);
    updateTotal();
  }

  function updateTotal() {
    let total = 0;
    let count = 0;
    for (const id in cart) {
      const item = findItem(id);
      total += item.price * cart[id];
      count += cart[id];
    }
    document.getElementById("total").textContent = fmt(total);
    document.getElementById("orderBtn").disabled = count === 0;
  }

  // ---------- Tarjeta de fidelidad ----------
  const stampsEl = document.getElementById("stamps");
  for (let i = 1; i <= STAMPS_TOTAL; i++) {
    const s = document.createElement("div");
    s.className = "stamp" + (i <= STAMPS_FILLED ? " filled" : "");
    s.textContent = i <= STAMPS_FILLED ? "☕" : i;
    stampsEl.appendChild(s);
  }

  // ---------- Pedido por WhatsApp ----------
  document.getElementById("orderBtn").addEventListener("click", () => {
    const lines = [];
    let total = 0;
    for (const cat of categoryNames) {
      const catLines = [];
      menu[cat].forEach(item => {
        const qty = cart[item.id] || 0;
        if (qty > 0) {
          catLines.push(`${qty}x ${item.name} — ${fmt(item.price * qty)}`);
          total += item.price * qty;
        }
      });
      if (catLines.length) lines.push(`*${cat}*\n${catLines.join("\n")}`);
    }
    if (!lines.length) return;

    const message =
      `Hola, quiero hacer un pedido en *Aroma de Barrio*:\n\n` +
      lines.join("\n\n") +
      `\n\n*Total: ${fmt(total)}*`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
  });

  // ---------- Service worker ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
